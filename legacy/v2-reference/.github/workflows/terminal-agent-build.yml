name: Windows terminal agent
on:
  push:
    branches:
      - feature/3food-pos-next-release-v2
    paths:
      - 'terminal-agent/**'
      - '.github/workflows/terminal-agent-build.yml'
  pull_request:
    paths:
      - 'terminal-agent/**'
      - '.github/workflows/terminal-agent-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained Windows agent
        run: dotnet publish terminal-agent/3Food.TerminalAgent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/3Food-TerminalAgent-win-x64
      - name: Upload Windows agent
        uses: actions/upload-artifact@v6
        with:
          name: 3food-terminal-agent-win-x64
          path: artifacts/3Food-TerminalAgent-win-x64/
          if-no-files-found: error
          retention-days: 14
