name: V3 Backend Validation

on:
  push:
    branches: [main]
    paths:
      - 'v3/backend/**'
      - 'database/v3/**'
      - 'scripts/check-v3-backend-*.php'
      - 'scripts/check-v3-order-payments.php'
      - '.github/workflows/v3-backend-validation.yml'
  pull_request:
    paths:
      - 'v3/backend/**'
      - 'database/v3/**'
      - 'scripts/check-v3-backend-*.php'
      - 'scripts/check-v3-order-payments.php'
      - '.github/workflows/v3-backend-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: PHP ${{ matrix.php }} backend checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax validation
        run: |
          find v3/backend scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Bootstrap configuration checks
        run: php scripts/check-v3-backend-bootstrap.php
      - name: HTTP kernel checks
        run: php scripts/check-v3-backend-http.php
      - name: Database configuration checks
        run: php scripts/check-v3-backend-database.php
      - name: Authentication guard checks
        run: php scripts/check-v3-backend-auth-guards.php
      - name: Inventory business and branch scope checks
        run: php scripts/check-v3-backend-inventory-read.php
      - name: Recipe API route and security contract checks
        run: php scripts/check-v3-backend-recipe-routes.php
      - name: Inventory draft document contract checks
        run: php scripts/check-v3-backend-inventory-documents.php
      - name: Order pagination and timezone-aware date filter contract checks
        run: php scripts/check-v3-backend-orders.php
      - name: Order cash payment ledger contract checks
        run: php scripts/check-v3-order-payments.php
      - name: Legacy SMS parser and National Payamak SmartSMS adapter tests
        run: |
          php v3/backend/tests/Communications/Sms/LegacySmsParserTest.php
          php v3/backend/tests/Communications/Sms/NationalPayamakSmartSmsProviderTest.php
          php v3/backend/tests/Communications/Sms/NationalPayamakSharedNumberProviderTest.php
