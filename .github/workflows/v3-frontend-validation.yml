name: V3 Frontend Validation

on:
  push:
    branches: [main]
    paths:
      - 'v3/frontend/**'
      - '.github/workflows/v3-frontend-validation.yml'
  pull_request:
    paths:
      - 'v3/frontend/**'
      - '.github/workflows/v3-frontend-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v3/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
